name: Fehler melden
description: Einen reproduzierbaren Fehler im Werkstattmanager melden.
body:
  - type: markdown
    attributes:
      value: Bitte keine Passwörter, Fahrzeugakten, Namen von Kunden oder unbereinigten Serverlogs veröffentlichen. Sicherheitslücken nicht in öffentlichen Issues melden.
  - type: textarea
    id: steps
    attributes:
      label: Was haben Sie gemacht?
      description: Schritte, erwartetes Ergebnis und tatsächliches Verhalten.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versionen
      description: App, Nextcloud, PHP, Datenbank, Browser und Gerät.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bereinigte Fehlermeldung
      description: Keine Zugangsdaten oder personenbezogenen Daten hinzufügen.
